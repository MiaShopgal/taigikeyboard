name: Android Debug APK

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: android-debug-apk
  cancel-in-progress: false

env:
  PROTOC_VERSION: 36.1
  PROTOC_SHA256: c4bc672d9d49214dc8cafdceadf4df92182d6ca8e3ec65a56b2d7de5602669b4

jobs:
  build:
    name: Build debug APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install Android SDK platform and NDK
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (
            set +o pipefail
            yes | "$sdkmanager" --licenses >/dev/null
          )
          "$sdkmanager" --install "platforms;android-36" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install protoc ${{ env.PROTOC_VERSION }}
        run: |
          set -euo pipefail
          curl -sSfL --retry 5 --retry-max-time 120 --retry-connrefused \
            --connect-timeout 20 --max-time 60 \
            -o "$RUNNER_TEMP/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          echo "${PROTOC_SHA256}  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"

      - name: Install Rust targets and cargo-ndk
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk --locked

      - name: Build debug APK
        run: make android-debug-apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TaigiKeyboard-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish rolling Android debug pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK_DIR: android/app/build/outputs/apk/debug
          RELEASE_TAG: android-debug-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          apk_file=""
          for apk in "$APK_DIR"/*.apk; do
            [[ -f "$apk" ]] || continue
            if [[ -n "$apk_file" ]]; then
              echo "::error::Expected exactly one debug APK in $APK_DIR"
              exit 1
            fi
            apk_file="$apk"
          done
          if [[ -z "$apk_file" ]]; then
            echo "::error::No debug APK found in $APK_DIR"
            exit 1
          fi

          gh release create "$RELEASE_TAG" "$apk_file" \
            --title "Android Debug Build #${GITHUB_RUN_NUMBER}" \
            --notes "Automated debug APK from commit ${GITHUB_SHA} on main." \
            --target "$GITHUB_SHA" \
            --prerelease

          old_tags="$(
            gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
              --jq '.[] | select(.prerelease == true)
                | select(.tag_name | startswith("android-debug-"))
                | select(.tag_name != env.RELEASE_TAG)
                | .tag_name'
          )"
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            gh release delete "$tag" --cleanup-tag --yes
          done <<< "$old_tags"

      - name: Delete previous APK artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          artifact_ids="$(
            gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
              --jq '.artifacts[]
                | select(.name | startswith("TaigiKeyboard-debug-"))
                | select(.workflow_run.id != (env.CURRENT_RUN_ID | tonumber))
                | .id'
          )"
          while IFS= read -r artifact_id; do
            [[ -n "$artifact_id" ]] || continue
            gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$artifact_id"
          done <<< "$artifact_ids"
